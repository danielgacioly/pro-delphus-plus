# Produção. Leia as variáveis de .env.prod (copie de .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# HTTP puro, sem certificado — sistema interno, acesso pela rede/VPN. Só o
# nginx publica porta; Postgres e API ficam na rede interna do compose.
#
# Nome do projeto fixo: sem isso, o Compose deriva o prefixo dos volumes do
# nome do diretório onde o clone mora, e scripts/restore.sh (que assume
# "prodelphusplus_uploads_data") pode acabar restaurando no volume errado.
name: prodelphusplus

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_URL}
      # 1 salto: só o nginx fica entre o navegador e a API.
      TRUST_PROXY: 1
      # HTTP puro: o cookie de sessão não pode ter a flag Secure, senão o
      # navegador o descarta e o login para de persistir. Ver README.
      COOKIE_SECURE: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      UPLOADS_DIR: /app/uploads
      ORDER_NUMBER_START: ${ORDER_NUMBER_START:-0}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    # O Chromium precisa de mais que os 64 MB padrão de /dev/shm ou trava ao
    # renderizar PDF com imagem.
    shm_size: 512m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

  # Backup diário do banco e dos uploads, com expurgo por contagem (mantém só
  # os BACKUP_KEEP_COUNT mais recentes — ver scripts/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: postgres
      BACKUP_DIR: /backups
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-2}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - uploads_data:/data/uploads:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache tar >/dev/null && while true; do /usr/local/bin/backup.sh || echo '[backup] FALHOU'; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]

# Os dois volumes vivem num diretório explícito no host (DATA_ROOT), não no
# local padrão do Docker (/var/lib/docker) — é isso que evita que o banco e os
# uploads acabem na mesma partição do sistema operacional. Ver README, seção
# "Onde os dados ficam guardados": DATA_ROOT deve apontar para um disco/
# partição separado, montado antes de rodar `docker compose up`.
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/postgres
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/uploads
