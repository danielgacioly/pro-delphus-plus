# Produção. Leia as variáveis de .env.prod (copie de .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Só o nginx publica porta. Postgres e API ficam na rede interna do compose.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_URL}
      TRUST_PROXY: 2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      UPLOADS_DIR: /app/uploads
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    # O Chromium precisa de mais que os 64 MB padrão de /dev/shm ou trava ao
    # renderizar PDF com imagem.
    shm_size: 512m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Sem porta publicada: quem fala com o mundo é o Caddy.

  # HTTPS. O Caddy termina a criptografia e repassa ao nginx pela rede interna.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e a CA interna vivem aqui — apagar este volume força
      # reemissão e, no caso da CA interna, invalida a raiz já distribuída.
      - caddy_data:/data
      - caddy_config:/config

  # Backup diário do banco e dos uploads, com expurgo por idade.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: postgres
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - uploads_data:/data/uploads:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache tar >/dev/null && while true; do /usr/local/bin/backup.sh || echo '[backup] FALHOU'; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
