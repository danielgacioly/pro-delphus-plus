name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prodelphus
          POSTGRES_PASSWORD: prodelphus
          POSTGRES_DB: prodelphusplus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prodelphus -d prodelphusplus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prodelphus:prodelphus@localhost:5433/prodelphusplus?schema=public
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      TRUST_PROXY: 0
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      GEMINI_API_KEY: ci-placeholder-key
      GEMINI_MODEL: gemini-3.5-flash-lite
      UPLOADS_DIR: ./uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: npm run lint --workspace=apps/web
      - name: Start API
        run: npm run dev:api > /tmp/prodelphus-api.log 2>&1 &
      - name: Wait for API
        run: node -e "const wait=async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://localhost:4000/api/health')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()"
      - run: npm run test:integration