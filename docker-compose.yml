services:
  postgres:
    image: postgres:16-alpine
    container_name: prodelphusplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodelphus
      POSTGRES_PASSWORD: prodelphus
      POSTGRES_DB: prodelphusplus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodelphus -d prodelphusplus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
