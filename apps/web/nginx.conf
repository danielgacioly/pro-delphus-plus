server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Um orçamento com muitas fotos, ou o upload de uma brochura, passa fácil do
  # padrão de 1 MB do nginx.
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # O bundle tem hash no nome, então pode ser cacheado para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Sem isto o rate limit da API veria só o IP do nginx e trataria a empresa
    # inteira como um cliente só.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A geração de PDF pelo Puppeteer pode passar dos 60s padrão em pedido grande.
    proxy_read_timeout 180s;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    expires 30d;
  }

  # SPA: qualquer rota desconhecida devolve o index para o React Router resolver.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
